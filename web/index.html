<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<title>myJAM</title>
<style>
:root{--text:#f5f5f7;--base:#050507;--tint:rgba(18,18,20,.3);--frost:blur(5px) saturate(1.15);--float:0 10px 28px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.14);color-scheme:dark}
:root[data-theme="light"]{--text:#1c1c1e;--base:#eef0f5;--tint:rgba(238,240,245,.3);color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--base);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
[hidden]{display:none!important}
.frost{background:var(--tint);-webkit-backdrop-filter:var(--frost);backdrop-filter:var(--frost);box-shadow:var(--float)}
#bg{position:fixed;inset:0;background:center/cover}
#veil{position:fixed;inset:0;background:var(--base);opacity:.5}
#app{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding:max(12px,env(safe-area-inset-top)) 18px max(16px,env(safe-area-inset-bottom))}
#top{align-self:stretch;height:44px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 18px}
#who{margin-left:auto;opacity:.7;font-size:14px}
#dot{width:9px;height:9px;border-radius:50%;background:#2fd1c5}
#hero{display:flex;flex-direction:column;align-items:center;margin-top:18px;min-height:0}
#art{position:relative;width:min(300px,calc(var(--tg-viewport-stable-height,100svh) - 430px));min-width:140px;aspect-ratio:1;border-radius:26px;background:rgba(255,255,255,.08) center/cover;box-shadow:0 30px 60px rgba(0,0,0,.55),0 8px 18px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.18)}
#art.nocover::after{content:"";position:absolute;inset:0;margin:auto;width:96px;height:96px;background:currentColor;opacity:.5;-webkit-mask:url(icons/music_note.svg) center/contain no-repeat;mask:url(icons/music_note.svg) center/contain no-repeat}
#live{position:absolute;left:12px;top:12px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#fff;padding:4px 9px;border-radius:99px;background:rgba(0,0,0,.45)}
#title{margin-top:18px;font-size:26px;font-weight:700;letter-spacing:-.02em;text-align:center}
#artist{margin-top:2px;opacity:.75;font-size:16px;text-align:center}
#plays{margin-top:12px;padding:7px 18px;border-radius:999px;font-size:14px}
#status{margin-top:24px;padding:0 24px;text-align:center;opacity:.75}
#grid{margin-top:auto;width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btn{height:76px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:13px;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.ic{display:block;width:28px;height:28px;line-height:28px;font-size:22px;text-align:center;background:currentColor;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;-webkit-mask-size:contain;mask-repeat:no-repeat;mask-position:center;mask-size:contain}
.ic.txt{background:none}
.i-tly{-webkit-mask-image:url(icons/music_note.svg);mask-image:url(icons/music_note.svg)}
.i-albnow{-webkit-mask-image:url(icons/library_music.svg);mask-image:url(icons/library_music.svg)}
.i-tstory{-webkit-mask-image:url(icons/planner_banner_ad_pt.svg);mask-image:url(icons/planner_banner_ad_pt.svg)}
.i-weekfm{-webkit-mask-image:url(icons/filter_7.svg);mask-image:url(icons/filter_7.svg)}
.i-monthfm{-webkit-mask-image:url(icons/30fps_select.svg);mask-image:url(icons/30fps_select.svg)}
.i-nowp{-webkit-mask-image:url(icons/arrow_upload_ready.svg);mask-image:url(icons/arrow_upload_ready.svg)}
.i-songcharts{-webkit-mask-image:url(icons/chart_data.svg);mask-image:url(icons/chart_data.svg)}
.i-radiofm{-webkit-mask-image:url(icons/radio.svg);mask-image:url(icons/radio.svg)}
#toast{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 20px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div id="bg"></div>
<div id="veil"></div>
<main id="app">
  <header id="top" class="frost"><span id="dot"></span><b>myJAM</b><span id="who"></span></header>
  <section id="hero">
    <div id="art"><span id="live" hidden></span></div>
    <h1 id="title" hidden></h1>
    <p id="artist" hidden></p>
    <p id="plays" class="frost" hidden></p>
    <p id="status">Carregando…</p>
  </section>
  <nav id="grid">
    <button class="btn frost" data-cmd="tly"><i class="ic i-tly"></i><span>Letra</span></button>
    <button class="btn frost" data-cmd="albnow"><i class="ic i-albnow"></i><span>Álbum</span></button>
    <button class="btn frost" data-cmd="tstory"><i class="ic i-tstory"></i><span>Story</span></button>
    <button class="btn frost" data-cmd="weekfm"><i class="ic i-weekfm"></i><span>Semana</span></button>
    <button class="btn frost" data-cmd="monthfm"><i class="ic i-monthfm"></i><span>Mês</span></button>
    <button class="btn frost" data-cmd="nowp"><i class="ic i-nowp"></i><span>Publicar</span></button>
    <button class="btn frost" data-cmd="tnowall" id="mosaico"><i class="ic txt">▦</i><span>Mosaico</span></button>
    <button class="btn frost" data-cmd="songcharts"><i class="ic i-songcharts"></i><span>Songcharts</span></button>
    <button class="btn frost" data-cmd="radiofm"><i class="ic i-radiofm"></i><span>RadioFM</span></button>
  </nav>
  <p id="toast" class="frost" role="status" hidden></p>
</main>
<script src="app.js"></script>
</body>
</html>
