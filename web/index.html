<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<title>myJAM</title>
</head>
<body style="margin:0;display:grid;place-items:center;min-height:100vh;font-family:system-ui;background:#111;color:#fff">
<p id="t">myJAM: página mínima carregada</p>
<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.Serverless.call("diag", { key: "open", note: "pagina-minima " + tg.platform + " v" + tg.version }, (err) => {
  document.getElementById("t").textContent = err ? "backend: " + err.message : "myJAM: página mínima e backend OK";
});
</script>
</body>
</html>
