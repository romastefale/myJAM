name: Mini App probe (temporário)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Respostas do servidor
        run: |
          U=https://app8786464392.tgcloud.ai
          for p in / /assets/ /icons/radio.svg /api/home; do
            echo "=== $p"; curl -sS -m 20 -D - -o /tmp/body "$U$p" | head -25; head -c 400 /tmp/body; echo
          done
          echo "=== index.html inteiro"; curl -sS -m 20 "$U/"
          echo; echo "=== js referenciado"
          JS=$(curl -sS -m 20 "$U/" | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sS -m 20 -D - -o /tmp/app.js "$U$JS" | head -15; wc -c /tmp/app.js
      - name: Abrir no Chromium
        run: |
          mkdir /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > run.mjs <<'EOF'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 390, height: 844 } });
          p.on("console", m => console.log("console:", m.type(), m.text().slice(0, 300)));
          p.on("pageerror", e => console.log("pageerror:", e.message.slice(0, 400)));
          p.on("requestfailed", r => console.log("requestfailed:", r.url(), r.failure()?.errorText));
          p.on("response", r => console.log("response:", r.status(), r.url()));
          await p.goto("https://app8786464392.tgcloud.ai/", { waitUntil: "networkidle" });
          await p.waitForTimeout(2000);
          console.log("BODY:", (await p.innerText("body")).replace(/\n/g, " | ").slice(0, 300));
          console.log("TELEGRAM:", await p.evaluate(() => typeof window.Telegram + " " + typeof window.Telegram?.WebApp?.Serverless));
          await b.close();
          EOF
          node run.mjs
