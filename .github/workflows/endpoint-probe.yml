name: Endpoint probe (temporário)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      OWNER_ID: ${{ vars.OWNER_ID || secrets.OWNER_ID }}
      LASTFM_API_KEY: ${{ secrets.LAST_FM_API_KEY || vars.LAST_FM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch
      - run: node scripts/apply-config.mjs
      - name: endpoint home
        run: |
          ID=$(echo "$OWNER_ID" | tr -cs '0-9' '\n' | head -1)
          npx tgcloud run endpoints/home '{}' --ctx "{ initData: { user: { id: $ID, first_name: \"Dono\" } } }"
      - name: endpoint run (weekfm, resposta no privado do dono)
        run: |
          ID=$(echo "$OWNER_ID" | tr -cs '0-9' '\n' | head -1)
          npx tgcloud run endpoints/run '{command:"weekfm"}' --ctx "{ initData: { user: { id: $ID, first_name: \"Dono\" } } }"
      - name: endpoint run (comando fora da lista)
        run: |
          ID=$(echo "$OWNER_ID" | tr -cs '0-9' '\n' | head -1)
          npx tgcloud run endpoints/run '{command:"setup"}' --ctx "{ initData: { user: { id: $ID, first_name: \"Dono\" } } }" || true
