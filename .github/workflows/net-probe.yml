name: Net probe (temporário)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Código oficial do Serverless no telegram-web-app.js
        run: |
          curl -sS -m 30 "https://telegram.org/js/telegram-web-app.js?64" -o /tmp/tw.js
          wc -c /tmp/tw.js
          grep -n -i "serverless\|timeout\|WebAppServerless" /tmp/tw.js | head -40
      - name: Trecho da implementação
        run: |
          L=$(grep -n "Serverless" /tmp/tw.js | head -1 | cut -d: -f1)
          sed -n "$((L-5)),$((L+70))p" /tmp/tw.js
