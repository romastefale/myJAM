name: Diag probe (temporário)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diag-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      OWNER_ID: ${{ vars.OWNER_ID || secrets.OWNER_ID }}
      LASTFM_API_KEY: ${{ secrets.LAST_FM_API_KEY || vars.LAST_FM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch
      - run: node scripts/apply-config.mjs
      - name: ler a marca (falha se o app nunca abriu)
        id: marca
        run: |
          ID=$(echo "$OWNER_ID" | tr -cs '0-9' '\n' | head -1)
          npx tgcloud run endpoints/diag '{read:true}' --ctx "{ initData: { user: { id: $ID, first_name: \"Dono\" } } }" > /tmp/diag.txt
          grep -o "open:[^,]*,err:[^,]*" /tmp/diag.txt | sed 's/[0-9]\{6,\}/N/g' > /tmp/resumo.txt || true
          cat /tmp/resumo.txt
          ! grep -q "open:null" /tmp/diag.txt
      - name: erro de JavaScript registrado? (falha se houver)
        run: grep -q "err:null" /tmp/diag.txt
