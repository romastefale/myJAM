name: Tstory probe (temporário)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/tstory-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      OWNER_ID: ${{ vars.OWNER_ID || secrets.OWNER_ID }}
      LASTFM_API_KEY: ${{ secrets.LAST_FM_API_KEY || vars.LAST_FM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch
      - run: node scripts/apply-config.mjs
      - name: /tstory no privado do dono
        run: |
          ID=$(echo "$OWNER_ID" | tr -cs '0-9' '\n' | head -1)
          npx tgcloud run handlers/message "{message_id:1,from:{id:$ID,first_name:\"Dono\"},chat:{id:$ID,type:\"private\"},text:\"/tstory\",entities:[{type:\"bot_command\",offset:0,length:7}]}"
