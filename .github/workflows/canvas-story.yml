name: Story com Canvas do Spotify

# Monta o story com o Canvas (o vídeo em loop do Spotify) como fundo: o bot dispara este workflow (API do
# GitHub, workflow_dispatch) com o link do vídeo (já resolvido via canvasdownloader.com) e os dados da
# faixa; a rotina desenha o mesmo texto do /tstory por cima do vídeo e devolve o MP4 ao chat. Requer:
#   - secret TELEGRAM_BOT_TOKEN (token do bot no BotFather; baixa o Canvas e envia o resultado)
#   - secret GH_DISPATCH_TOKEN ou FINE (mesmo token do vídeo do /tstory)
on:
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON com chat_id, user, track, plays e canvas_url (enviado pelo bot)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  canvas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar motor de imagem e fontes
        run: npm i --no-save --no-audit --no-fund @resvg/resvg-wasm@2.6.2 @expo-google-fonts/inter@0.4.2 dejavu-fonts-ttf@2.37.3

      - name: Montar e enviar o story
        env:
          STORY_PAYLOAD: ${{ inputs.payload }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/canvas-story.mjs
